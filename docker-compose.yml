version: '3.3'
services:
  flightalerter:
    # image: flightalerter
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${WEB_PORT:-8095}:${WEB_PORT:-8095}"
    environment:
      # Settings, secrets and alert history live in this folder, not in the image's /code.
      DATA_DIR: /data
    volumes:
      - .:/data
